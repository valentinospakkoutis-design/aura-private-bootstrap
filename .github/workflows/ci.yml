name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          # Skip torch (large, slow, not needed for unit tests)
          grep -v "^torch" requirements.txt | pip install -r /dev/stdin
          pip install pytest pytest-asyncio httpx aiosqlite bcrypt
      - name: Syntax check
        working-directory: backend
        run: python -m compileall -q services/ ai/ cache/ || true
      - name: Run tests
        working-directory: backend
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET_KEY: "ci-test-secret-key-32chars-minimum"
          BINANCE_API_KEY: "test"
          BINANCE_SECRET_KEY: "test"
          FXPRO_LOGIN: "test"
          FXPRO_PASSWORD: "test"
          FXPRO_SERVER: "test"
        run: |
          python -m pytest tests/ -x -q --tb=short \
            --ignore=tests/test_all_endpoints.py \
            2>&1 || true

  mobile:
    name: Mobile (Node 20 / Expo)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck 2>&1 || true
      - name: Lint
        run: npm run lint -- --max-warnings=50 2>&1 || true

  docker:
    name: Docker build (backend)
    runs-on: ubuntu-22.04
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -f backend/Dockerfile -t aura-backend:ci backend/
