# GitHub Actions Workflow for AURA Deployment
# Deploys backend to Hetzner VPS via SSH after a successful Build and Test run.
# CI POLICY: deploy only runs after a successful Build and Test workflow.
#            Deploy triggers ONLY via workflow_run — never directly on push.
#            The checked-out SHA is pinned to the SHA that passed CI.

name: Deploy

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production (Hetzner)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout code at verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA matches CI-passed SHA
        run: |
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$DEPLOY_SHA" ]; then
            echo "SHA mismatch: checked out $ACTUAL but expected $DEPLOY_SHA"
            exit 1
          fi
          echo "SHA verified: $DEPLOY_SHA"

      - name: Deploy backend to Hetzner via SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            root@116.203.75.114 \
            "cd /root/aura-private-bootstrap && \
             git fetch origin && \
             git checkout ${DEPLOY_SHA} && \
             DEPLOY_SHA=${DEPLOY_SHA} \
             tmux new-session -d -s ci-deploy \
               'bash deploy.sh 2>&1 | tee /tmp/ci-deploy.log; echo EXIT:\$? >> /tmp/ci-deploy.log' && \
             sleep 10 && \
             tail -30 /tmp/ci-deploy.log"

          rm -f /tmp/deploy_key

  deploy-staging:
    name: Deploy to Staging (Hetzner)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout code at verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA matches CI-passed SHA
        run: |
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$DEPLOY_SHA" ]; then
            echo "SHA mismatch: checked out $ACTUAL but expected $DEPLOY_SHA"
            exit 1
          fi
          echo "SHA verified: $DEPLOY_SHA"

      - name: Deploy backend to Hetzner staging via SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            root@116.203.75.114 \
            "cd /root/aura-private-bootstrap && \
             git fetch origin && \
             git checkout ${DEPLOY_SHA} && \
             DEPLOY_SHA=${DEPLOY_SHA} APP_ENV=staging \
             tmux new-session -d -s ci-deploy-staging \
               'bash deploy.sh 2>&1 | tee /tmp/ci-deploy-staging.log; echo EXIT:\$? >> /tmp/ci-deploy-staging.log' && \
             sleep 10 && \
             tail -30 /tmp/ci-deploy-staging.log"

          rm -f /tmp/deploy_key
